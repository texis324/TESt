<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>エアホッケー</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e8f0ff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #score { font-size: 28px; font-weight: 700; letter-spacing: 2px; }
  canvas { background: #12304f; border: 4px solid #5fb4ff; border-radius: 12px; touch-action: none; max-height: 80vh; }
  #msg { font-size: 14px; opacity: .8; height: 20px; }
  button { font-size: 16px; padding: 8px 18px; border: 0; border-radius: 8px; background: #5fb4ff; color: #06223b; font-weight: 700; }
</style>
</head>
<body>
<div id="score">あなた 0 - 0 CPU</div>
<canvas id="c" width="400" height="640"></canvas>
<div id="msg">マウス/指でマレットを動かそう。先に7点取った方が勝ち!</div>
<button id="reset">リスタート</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GOAL_W = 140, WIN = 7;
const R_PUCK = 14, R_MAL = 28;
const MAX_PUCK = 16, FRICTION = 0.995;

let puck, me, cpu, score, over, serveTimer;

function init() {
  score = { me: 0, cpu: 0 };
  over = false;
  me  = { x: W / 2, y: H - 90, px: W / 2, py: H - 90, vx: 0, vy: 0 };
  cpu = { x: W / 2, y: 90, vx: 0, vy: 0 };
  serve(1);
  updateScore();
  setMsg('マウス/指でマレットを動かそう。先に' + WIN + '点取った方が勝ち!');
}

function serve(dir) {
  puck = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
  serveTimer = 40;
  puck.serveDir = dir;
}

function updateScore() {
  document.getElementById('score').textContent = 'あなた ' + score.me + ' - ' + score.cpu + ' CPU';
}
function setMsg(t) { document.getElementById('msg').textContent = t; }

// --- 入力 ---
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height };
}
function onMove(e) {
  e.preventDefault();
  const p = pointerPos(e);
  me.x = Math.max(R_MAL, Math.min(W - R_MAL, p.x));
  me.y = Math.max(H / 2 + R_MAL, Math.min(H - R_MAL, p.y));
}
cv.addEventListener('mousemove', onMove);
cv.addEventListener('touchstart', onMove, { passive: false });
cv.addEventListener('touchmove', onMove, { passive: false });
document.getElementById('reset').onclick = init;

// --- 物理 ---
function collideMallet(m) {
  const dx = puck.x - m.x, dy = puck.y - m.y;
  const dist = Math.hypot(dx, dy), min = R_PUCK + R_MAL;
  if (dist < min && dist > 0) {
    const nx = dx / dist, ny = dy / dist;
    puck.x = m.x + nx * min;
    puck.y = m.y + ny * min;
    // マレットの速度を加味して反射
    const rvx = puck.vx - m.vx, rvy = puck.vy - m.vy;
    const dot = rvx * nx + rvy * ny;
    if (dot < 0) {
      puck.vx -= 2 * dot * nx;
      puck.vy -= 2 * dot * ny;
    }
    puck.vx += m.vx * 0.5;
    puck.vy += m.vy * 0.5;
  }
}

function step() {
  if (over) return;

  // 自分のマレットの速度
  me.vx = me.x - me.px; me.vy = me.y - me.py;
  me.px = me.x; me.py = me.y;

  // サーブ待ち
  if (serveTimer > 0) {
    serveTimer--;
    if (serveTimer === 0) { puck.vy = puck.serveDir * 4; puck.vx = (Math.random() - .5) * 3; }
  }

  // CPU
  const prevX = cpu.x, prevY = cpu.y;
  let tx = W / 2, ty = 90;
  if (puck.y < H / 2 + 20) {
    // パックが自陣側 → 打ちに行く
    tx = puck.x; ty = puck.y - 30;
    if (puck.y < cpu.y) ty = puck.y + 10;
  } else if (puck.vy > 0 || puck.y > H / 2) {
    tx = W / 2 + (puck.x - W / 2) * 0.4;
  }
  const speed = 5.2;
  const ddx = tx - cpu.x, ddy = ty - cpu.y, dd = Math.hypot(ddx, ddy);
  if (dd > 1) { const s = Math.min(speed, dd); cpu.x += ddx / dd * s; cpu.y += ddy / dd * s; }
  cpu.x = Math.max(R_MAL, Math.min(W - R_MAL, cpu.x));
  cpu.y = Math.max(R_MAL, Math.min(H / 2 - R_MAL, cpu.y));
  cpu.vx = cpu.x - prevX; cpu.vy = cpu.y - prevY;

  // パック移動
  puck.x += puck.vx; puck.y += puck.vy;
  puck.vx *= FRICTION; puck.vy *= FRICTION;

  collideMallet(me);
  collideMallet(cpu);

  const sp = Math.hypot(puck.vx, puck.vy);
  if (sp > MAX_PUCK) { puck.vx *= MAX_PUCK / sp; puck.vy *= MAX_PUCK / sp; }

  // 壁
  if (puck.x < R_PUCK) { puck.x = R_PUCK; puck.vx = Math.abs(puck.vx); }
  if (puck.x > W - R_PUCK) { puck.x = W - R_PUCK; puck.vx = -Math.abs(puck.vx); }

  const inGoal = Math.abs(puck.x - W / 2) < GOAL_W / 2;
  if (puck.y < R_PUCK) {
    if (inGoal) return goal('me');
    puck.y = R_PUCK; puck.vy = Math.abs(puck.vy);
  }
  if (puck.y > H - R_PUCK) {
    if (inGoal) return goal('cpu');
    puck.y = H - R_PUCK; puck.vy = -Math.abs(puck.vy);
  }
}

function goal(who) {
  score[who]++;
  updateScore();
  if (score[who] >= WIN) {
    over = true;
    setMsg(who === 'me' ? 'あなたの勝ち! 🎉 リスタートで再戦' : 'CPUの勝ち… リスタートで再戦');
    return;
  }
  setMsg(who === 'me' ? 'ゴール!' : '失点…');
  serve(who === 'me' ? 1 : -1);
}

// --- 描画 ---
function circle(x, y, r, fill, stroke) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2); ctx.stroke();
  // ゴール
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(W / 2 - GOAL_W / 2, 0, GOAL_W, 6);
  ctx.fillRect(W / 2 - GOAL_W / 2, H - 6, GOAL_W, 6);
  circle(cpu.x, cpu.y, R_MAL, '#ff8a8a', '#fff');
  circle(me.x, me.y, R_MAL, '#7dffb0', '#fff');
  circle(puck.x, puck.y, R_PUCK, '#111', '#ffd34d');
}

function loop() { step(); draw(); requestAnimationFrame(loop); }
init();
loop();
</script>
</body>
</html>
