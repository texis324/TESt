<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プレビューデモ</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .card {
    background: white;
    padding: 40px 60px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
  }
  h1 { color: #333; margin: 0 0 10px; }
  p { color: #777; margin: 0 0 20px; }
  button {
    background: #667eea;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #5566d9; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎉 こんにちは！</h1>
    <p>これはクソ簡単なHTMLプレビューのデモです</p>
    <button onclick="alert('動いてるよ！')">押してみて</button>
  </div>
</body>
</html>
